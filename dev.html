<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="theme-color" content="#0d1117" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Satellite Ground Track Planner</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
</head>
<body>
  <div id="app">
    <aside id="sidebar"></aside>
    <main id="map-container">
      <div id="pass-countdown-overlay"></div>
      <div id="map-search">
        <input type="text" id="map-search-input" placeholder="Konum ara..." autocomplete="off" />
        <div id="map-search-results"></div>
      </div>
      <div id="map"></div>
      <div id="coords-display"></div>
    </main>
    <aside id="right-panel"></aside>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
